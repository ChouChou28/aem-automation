<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { color-scheme: light; --ink:#172033; --muted:#647084; --line:#dfe3e8; --surface:#f5f7f9; --primary:#243b63; --success:#16734a; --danger:#b42318; }
      * { box-sizing: border-box; }
      body { width: 340px; margin: 0; padding: 16px; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--ink); background: #fff; }
      .brand { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
      .mark { display:grid; width:34px; height:34px; place-items:center; border-radius:8px; color:#fff; background:var(--primary); }
      .mark svg { width:18px; height:18px; }
      h1 { margin:0; font-size:14px; line-height:1.2; }
      .sub { margin:2px 0 0; font-size:11px; color:var(--muted); }
      .config { margin-bottom:14px; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
      label { display:block; margin-bottom:6px; font-size:11px; font-weight:650; color:#3f4b5f; }
      .input-row { display:flex; gap:7px; }
      input { min-width:0; height:38px; flex:1; padding:0 10px; border:1px solid #cbd2dc; border-radius:7px; color:var(--ink); background:#fff; font:12px/1.4 "Segoe UI", system-ui, sans-serif; outline:none; }
      input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgb(36 59 99 / 12%); }
      .hint { margin:6px 0 0; font-size:10px; color:var(--muted); overflow-wrap:anywhere; }
      button { min-height:38px; border:0; border-radius:7px; padding:8px 12px; font-size:12px; font-weight:650; cursor:pointer; transition:background-color 160ms, border-color 160ms, opacity 160ms; }
      button:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
      button:disabled { cursor:not-allowed; opacity:.5; }
      .primary { width:100%; margin-bottom:8px; color:#fff; background:var(--primary); }
      .primary:hover { background:#1d3153; }
      .save { flex:0 0 auto; color:#fff; background:var(--primary); }
      .ghost { flex:1; color:var(--ink); border:1px solid var(--line); background:#fff; font-weight:550; }
      .ghost:hover { background:var(--surface); }
      .row { display:flex; gap:8px; }
      #status { min-height:34px; margin-top:10px; padding:8px 10px; border-radius:7px; color:#48566c; background:#eef1f5; font-size:11px; white-space:pre-wrap; }
      #status.err { color:var(--danger); background:#fef3f2; }
      #status.ok { color:var(--success); background:#ecf8f2; }
      @media (prefers-reduced-motion:reduce) { * { transition-duration:.01ms !important; } }
    </style>
  </head>
  <body>
    <header class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg></span>
      <div><h1>AEM Cookie Bridge</h1><p class="sub">Secure cookie handoff for Samsung AEM</p></div>
    </header>

    <section class="config" aria-labelledby="target-label">
      <label id="target-label" for="target-url">Automation app URL</label>
      <div class="input-row"><input id="target-url" type="url" inputmode="url" spellcheck="false" placeholder="http://localhost:3000" /><button id="save-target" class="save">Save</button></div>
      <p class="hint" id="target-hint">The bridge will only run on this origin.</p>
    </section>

    <button id="sync" class="primary">Send cookies to app</button>
    <div class="row"><button id="copy" class="ghost">Copy JSON</button><button id="download" class="ghost">Download JSON</button></div>
    <div id="status" role="status" aria-live="polite">Ready.</div>
    <script src="popup.js"></script>
  </body>
</html>
