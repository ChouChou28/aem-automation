<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        color-scheme: light;
        --blue: #2f6fed;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 2px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      p.sub {
        margin: 0 0 12px;
        font-size: 11px;
        color: #64748b;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
      }
      .primary {
        background: var(--blue);
        color: #fff;
      }
      .ghost {
        background: #fff;
        border: 1px solid #e2e8f0;
        color: #0f172a;
        font-weight: 500;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row button {
        flex: 1;
      }
      #status {
        font-size: 11px;
        color: #475569;
        background: #eef2ff;
        border-radius: 8px;
        padding: 8px 10px;
        min-height: 14px;
        white-space: pre-wrap;
      }
      #status.err {
        background: #fef2f2;
        color: #b91c1c;
      }
      #status.ok {
        background: #ecfdf5;
        color: #047857;
      }
    </style>
  </head>
  <body>
    <h1>🔗 AEM Cookie Bridge</h1>
    <p class="sub">Reads <b>samsung.com</b> cookies (incl. HttpOnly).</p>

    <button id="sync" class="primary">Send to Automation app</button>
    <div class="row">
      <button id="copy" class="ghost">Copy JSON</button>
      <button id="download" class="ghost">Download .json</button>
    </div>
    <div id="status">Ready.</div>

    <script src="popup.js"></script>
  </body>
</html>
